<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viv</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="icon" type="image/png" sizes="256x256" href="/static/icon.png">
<link rel="apple-touch-icon" href="/static/icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a0714">
<link rel="stylesheet" href="/static/viv.css">
</head>
<body data-state="sleeping">
<canvas id="core" aria-hidden="true"></canvas>
<svg id="links" aria-hidden="true"></svg>

<header class="top">
  <div class="brand"><span class="brand-name">VIV</span><span class="brand-sub">assistente pessoal</span></div>
  <div class="status" role="status" aria-live="polite">
    <span class="dot"></span><span id="state-label">Dormindo</span>
    <span id="conn" class="conn" hidden>reconectando…</span>
    <span id="mood" class="chip" title="Humor da Viv" hidden></span>
    <span id="who" class="chip" title="Quem está falando, pelo reconhecimento de voz" hidden></span>
  </div>
  <div class="meta"><span id="mic" title="Microfone em uso"></span><span id="clock"></span>
    <button id="gear" type="button" aria-label="Configurações" aria-expanded="false" aria-controls="settings">⚙</button></div>
</header>

<section id="cards" aria-label="Informações e ações"></section>
<section id="wa" aria-label="WhatsApp" aria-live="polite"></section>
<section id="confirm-slot" aria-live="assertive"></section>

<aside id="settings" aria-label="Configurações" hidden>
  <header><h2>Configurações</h2><button id="settings-close" type="button" aria-label="Fechar">×</button></header>
  <p class="settings-note">A Viv também muda estes ajustes por voz: “Viv, eu uso fones”, “meu nome é…”.</p>
  <div id="settings-list"></div>
  <h3>Rotina</h3>
  <div id="routine-list"></div>
  <form id="routine-form">
    <input id="routine-time" type="time" required aria-label="Hora">
    <input id="routine-text" type="text" maxlength="200" required placeholder="O que acontece" aria-label="Descrição">
    <select id="routine-days" aria-label="Dias"><option value="todos">Todos os dias</option><option value="uteis">Dias úteis</option><option value="fim de semana">Fim de semana</option></select>
    <button type="submit">Adicionar</button>
  </form>
  <p id="settings-msg" class="settings-msg" role="status"></p>
</aside>

<div id="avatar" role="img" aria-label="Viv"><canvas id="avatar-canvas" width="60" height="42"></canvas></div>

<footer class="bottom">
  <div id="progress" role="status" aria-live="polite" hidden>
    <span id="progress-label"></span>
    <div class="progress-track"><i id="progress-fill"></i></div>
  </div>
  <div class="caption" aria-live="polite">
    <p id="caption-user" class="caption-user"></p>
    <p id="caption-viv" class="caption-viv"></p>
  </div>
  <button id="wake" type="button">Ativar Viv</button>
  <p id="hint" class="hint">Diga “Ei, Viv”, bata duas palmas ou aperte Ctrl+Alt+V.</p>
</footer>

<script src="/static/core.js"></script>
<script src="/static/cards.js"></script>
<script src="/static/whatsapp.js"></script>
<script src="/static/avatar.js"></script>
<script src="/static/app.js"></script>
<script src="/static/settings.js"></script>
</body>
</html>
